<div class="card h-100">
  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>
    <p class="mb-1"><strong>Code:</strong> {{ trip.code }}</p>
    <p class="mb-1"><strong>Length:</strong> {{ trip.length }}</p>
    <p class="mb-1"><strong>Start:</strong> {{ trip.start }}</p>
    <p class="mb-1"><strong>Resort:</strong> {{ trip.resort }}</p>
    <p class="mb-1"><strong>Per Person:</strong> {{ trip.perPerson }}</p>
    <p class="text-muted small mb-0">{{ trip.description }}</p>
  </div>

  <div class="card-footer d-flex gap-2">
    <a class="btn btn-outline-secondary btn-sm" [routerLink]="['/trips/edit', trip._id]">Edit</a>
    <button class="btn btn-outline-danger btn-sm" (click)="deleteTrip()" [disabled]="deleting">
      {{ deleting ? 'Deleting...' : 'Delete' }}
    </button>
  </div>
</div>
