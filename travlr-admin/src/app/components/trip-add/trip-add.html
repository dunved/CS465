<div class="container mt-4">
  <h3>Add Trip</h3>

  <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>
  <div *ngIf="successMsg" class="alert alert-success">{{ successMsg }}</div>

  <form (ngSubmit)="onSubmit()" #tripForm="ngForm">
    <div class="mb-3">
      <label for="code" class="form-label">Code</label>
      <input type="text" class="form-control" id="code" name="code"
             [(ngModel)]="trip.code" required />
    </div>
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" name="name"
             [(ngModel)]="trip.name" required />
    </div>
    <div class="mb-3">
      <label for="length" class="form-label">Length</label>
      <input type="text" class="form-control" id="length" name="length"
             [(ngModel)]="trip.length" required placeholder="e.g. 7 days" />
    </div>
    <div class="mb-3">
      <label for="start" class="form-label">Start Date</label>
      <input type="text" class="form-control" id="start" name="start"
             [(ngModel)]="trip.start" required placeholder="e.g. 2026-03-15" />
    </div>
    <div class="mb-3">
      <label for="resort" class="form-label">Resort</label>
      <input type="text" class="form-control" id="resort" name="resort"
             [(ngModel)]="trip.resort" required />
    </div>
    <div class="mb-3">
      <label for="perPerson" class="form-label">Per Person ($)</label>
      <input type="number" class="form-control" id="perPerson" name="perPerson"
             [(ngModel)]="trip.perPerson" required />
    </div>
    <div class="mb-3">
      <label for="image" class="form-label">Image URL</label>
      <input type="text" class="form-control" id="image" name="image"
             [(ngModel)]="trip.image" required />
    </div>
    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" name="description"
                [(ngModel)]="trip.description" required rows="4"></textarea>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary"
              [disabled]="!tripForm.valid || saving">
        {{ saving ? 'Saving...' : 'Add Trip' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    </div>
  </form>
</div>
